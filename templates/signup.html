{% extends "base.html" %}
{% block title %}Create Account | Pushpa Construction{% endblock %}
{% block content %}
<section class="auth-section"><div class="auth-card"><p class="eyebrow">JOIN BUILD RIGHT</p><h1>Create your account.</h1><p>Keep your construction enquiries connected in one place.</p>
<form method="post" class="form-grid">
<div class="field full"><label for="name">Full name</label><input id="name" name="name" maxlength="120" autocomplete="name" required></div>
<div class="field full"><label for="email">Email address</label><input id="email" name="email" type="email" maxlength="190" autocomplete="email" required></div>
<div class="field full">
  <label for="password">Password (minimum 8 characters)</label>
  <div class="password-wrap">
    <input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required>
    <button type="button" class="toggle-password" data-target="password" aria-label="Toggle password visibility" title="Show/Hide Password">
      <svg class="eye-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
        <circle cx="12" cy="12" r="3"></circle>
      </svg>
      <svg class="eye-closed" style="display:none;" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
        <line x1="1" y1="1" x2="23" y2="23"></line>
      </svg>
    </button>
  </div>
</div>
<div class="field full">
  <label for="confirm_password">Confirm password</label>
  <div class="password-wrap">
    <input id="confirm_password" name="confirm_password" type="password" minlength="8" autocomplete="new-password" required>
    <button type="button" class="toggle-password" data-target="confirm_password" aria-label="Toggle password visibility" title="Show/Hide Password">
      <svg class="eye-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
        <circle cx="12" cy="12" r="3"></circle>
      </svg>
      <svg class="eye-closed" style="display:none;" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
        <line x1="1" y1="1" x2="23" y2="23"></line>
      </svg>
    </button>
  </div>
</div>
<div class="full"><button class="btn btn-primary btn-block" type="submit">Create account</button></div>
</form><p class="auth-switch">Already registered? <a href="{{ url_for('login') }}">Log in</a></p></div></section>
{% endblock %}
